# cargo-deny configuration for OnYX workspace (R-7).
# Enforces vulnerability advisories, permissive license compatibility (`MIT OR Apache-2.0`),
# and blocks unknown crate registries or git dependencies.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
    # Transitive deps of `ratatui 0.29.0` (`ratatui 0.30+` requires rustc 1.88, while workspace MSRV is 1.85.1).
    { id = "RUSTSEC-2024-0436", reason = "paste is a transitive proc-macro dep of ratatui 0.29 (MSRV 1.85.1)" },
    { id = "RUSTSEC-2026-0253", reason = "lru 0.12 is a transitive dep of ratatui 0.29 (MSRV 1.85.1); no panicking Drop keys in cache" },
    { id = "RUSTSEC-2026-0002", reason = "lru 0.12 is a transitive dep of ratatui 0.29 (MSRV 1.85.1); IterMut not used" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "BSL-1.0",
    "MIT-0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
