name: CI

on:
  push:
    branches: [main, "feat/**", "test/**", "epic/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.85.1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust 1.85
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check -p onyx-workspace --no-default-features --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --release --locked
      - name: Comprobar documentación
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Cargo Audit (RustSec advisories)
        run: cargo audit
      - name: Cargo Deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --locked
          command: check
          command-arguments: advisories licenses bans sources
