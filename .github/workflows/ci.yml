name: CI

on:
  push:
    branches: [main, "feat/**", "test/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.85.1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust 1.85
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check -p onyx-workspace --no-default-features --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --release --locked
      - name: Comprobar documentación
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      # Override rust-toolchain.toml (MSRV 1.85.1): cargo-audit 0.23+ requires rustc >= 1.88
      # and only parses Cargo.lock / Cargo.toml without compiling the workspace.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - name: Cargo Audit (RustSec advisories)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cargo Deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --locked check advisories licenses bans sources
