[package]
name = "onyx-scent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Deterministic AST indexer, thermal impact distiller, and TOON serializer for OnYX harnesses."
readme = "README.md"
keywords = ["ast", "tree-sitter", "indexer", "agents", "toon"]
categories = ["development-tools", "parser-implementations"]
exclude = ["snapshots/", "snaps*/", "*.tr", "*.onyxpack", "*.onyxpack.tmp"]

[features]
default = []
cli = ["dep:clap"]

[dependencies]
blake3 = { workspace = true }
clap = { workspace = true, optional = true }
tree-sitter = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-rust = { workspace = true }

[[bin]]
name = "scent"
path = "src/bin/scent.rs"
required-features = ["cli"]
