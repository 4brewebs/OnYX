[workspace]
# Crates que compilan y se verifican con `cargo test --workspace`.
members = [
    "onyx-core",
    "onyx-soul",
    "onyx-soul-agents",
    "onyx-example-app",
]
# En desarrollo: todavía no compilan con la API actual de core.
# Se excluyen para que `--workspace` siga en verde; cuando un crate compile,
# muévelo a `members`. Para probarlo por separado sin crear otro `target/`:
# `cargo check --manifest-path <crate>/Cargo.toml --target-dir target`
# (Cargo genera un `Cargo.lock` local en el crate; no lo subas).
# - onyx-example-agents: usa la API antigua de onyx-soul-agents.
exclude = [
    "onyx-example-agents",
]
resolver = "3"
