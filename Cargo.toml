[workspace]
# Crates que compilan y se verifican con `cargo test --workspace`.
members = [
    "onyx-core",
    "onyx-soul",
    "onyx-soul-agents",
    "onyx-scent",
    "onyx-workspace",
    "open-onyx",
    "onyx-example-app",
    "onyx-example-agents",
]
# Si un crate WIP no compila con la API actual, muévelo a `exclude`
# para que `--workspace` siga en verde. Para probarlo por separado
# sin crear otro `target/`:
# `cargo check --manifest-path <crate>/Cargo.toml --target-dir target`
# (el `Cargo.lock` local que genera Cargo ya lo ignora `.gitignore`).
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/4brewebs/OnYX"
homepage = "https://github.com/4brewebs/OnYX"

[workspace.dependencies]
onyx-core = { version = "0.1.0", path = "onyx-core" }
onyx-soul = { version = "0.1.0", path = "onyx-soul" }
onyx-soul-agents = { version = "0.1.0", path = "onyx-soul-agents" }
onyx-scent = { version = "0.1.0", path = "onyx-scent" }
onyx-workspace = { version = "0.1.1", path = "onyx-workspace" }
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
flate2 = "1"
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.20"
tree-sitter-java = "0.20"
tree-sitter-python = "0.20"
tree-sitter-rust = "0.20"
ureq = { version = "2", features = ["json"] }
