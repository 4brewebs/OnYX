[package]
name = "onyx-workspace"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Workspace capabilities (filesystem, search, edit, shell) with sandbox policy for OnYX agent harnesses."
readme = "README.md"
keywords = ["agents", "workspace", "sandbox", "tools", "onyx"]
categories = ["development-tools"]
exclude = ["snapshots/", "snaps*/", "*.tr", "*.onyxpack", "*.onyxpack.tmp"]

[features]
default = []
scent = ["dep:onyx-scent"]
mcp = []

# TEST-04.2: servidor MCP *mock* `stdio` re-ejecutable (portable Windows+Linux,
# sin python/node en CI). Como `harness = false`, `main()` es el propio protocolo
# cuando `ONYX_MCP_MOCK_ROLE=server`, y la suite E2E cuando `cargo test` lo invoca.
[[test]]
name = "mcp_stdio"
harness = false
required-features = ["mcp"]

[dependencies]
blake3 = { workspace = true }
onyx-scent = { workspace = true, optional = true }
onyx-soul-agents = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
