[package]
name = "onyx-workspace"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Workspace capabilities (filesystem, search, edit, shell) with sandbox policy for OnYX agent harnesses."
readme = "README.md"
keywords = ["agents", "workspace", "sandbox", "tools", "onyx"]
categories = ["development-tools"]
exclude = ["snapshots/", "snaps*/", "*.tr", "*.onyxpack", "*.onyxpack.tmp"]

[features]
default = []
scent = ["dep:onyx-scent"]

[dependencies]
onyx-scent = { workspace = true, optional = true }
onyx-soul-agents = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
