[package]
name = "onyx-workspace"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Workspace capabilities (filesystem, search, edit, shell) with sandbox policy for OnYX agent harnesses."
license = "MIT OR Apache-2.0"

[dependencies]
onyx-soul-agents = { path = "../onyx-soul-agents" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
