[book]
title = "openOnyx — Manual de Usuario / User Manual"
description = "Complete bilingual guide (ES/EN) for the deterministic openOnyx coding-agent harness (CLI, TUI, vault, sandbox, time-travel, forking, Scent & Sprout)."
authors = ["OnYX"]
language = "es"
src = "manual"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "ayu"
site-url = "/OnYX/"
git-repository-url = "https://github.com/4brewebs/OnYX"
edit-url-template = "https://github.com/4brewebs/OnYX/edit/main/docs/manual/{path}"
