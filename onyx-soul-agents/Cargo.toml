[package]
name = "onyx-soul-agents"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Agent harness soul for OnYX. Implements the core ports with agent-oriented semantics."
license = "MIT OR Apache-2.0"

[dependencies]
onyx-core = { path = "../onyx-core" }

[dev-dependencies]
onyx-core = { path = "../onyx-core", features = ["conformance"] }
