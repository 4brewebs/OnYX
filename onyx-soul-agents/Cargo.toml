[package]
name = "onyx-soul-agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Agent harness soul for OnYX. Implements the core ports with agent-oriented semantics."
readme = "README.md"
keywords = ["agents", "deterministic", "replay", "llm", "harness"]
categories = ["development-tools", "simulation"]
exclude = ["snapshots/", "snaps*/", "*.tr", "*.onyxpack", "*.onyxpack.tmp"]

[dependencies]
onyx-core = { workspace = true }

[dev-dependencies]
onyx-core = { workspace = true, features = ["conformance"] }
