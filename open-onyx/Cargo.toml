[package]
name = "open-onyx"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "openOnyx — Deterministic coding agent harness built on onyx-soul-agents and onyx-workspace."
license = "MIT OR Apache-2.0"

[[bin]]
name = "openonyx"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
flate2 = "1"
onyx-soul-agents = { path = "../onyx-soul-agents" }
onyx-workspace = { path = "../onyx-workspace", features = ["scent"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
