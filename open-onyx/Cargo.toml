[package]
name = "open-onyx"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "openOnyx — Deterministic coding agent harness built on onyx-soul-agents and onyx-workspace."
readme = "README.md"
keywords = ["ai", "coding-agent", "tui", "deterministic", "onyx"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["snapshots/", "snaps*/", "*.tr", "*.onyxpack", "*.onyxpack.tmp"]

[[bin]]
name = "openonyx"
path = "src/main.rs"

[dependencies]
blake3 = { workspace = true }
crossterm = { workspace = true }
flate2 = { workspace = true }
onyx-soul-agents = { workspace = true }
onyx-workspace = { workspace = true, features = ["scent"] }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
